apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-self-sa-read
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
    resourceNames: ["argocd-manager"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["argocd-manager-token"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-self-sa-read
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
roleRef:
  kind: Role
  name: argocd-self-sa-read
  apiGroup: rbac.authorization.k8s.io
